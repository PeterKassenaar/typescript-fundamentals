<!--    NOTE: The type="module" attribute tells the browser to load the script as a module.
It can now handle *.ts files directly.

They are transpiled INSTANTLY on the Vite Server and send
to the browser as JavaSCript files. So the browser itself does NOT run TS, but relies on the Vite Server,
which is already running TypeScript and is BLAZINGLY fast-->
<script type="module" src="/src/main.ts"></script>
</body>
